# Tarieven van leveranciers — alle bedragen INCLUSIEF btw.
#
# Netbeheerkosten en de vermindering energiebelasting zijn bij elke leverancier
# gelijk en tellen daarom niet mee in de vergelijking.
#
# Werk deze lijst periodiek bij (bijv. via leveranciers' tarievenbladen of een
# vergelijkingssite). Het rapport waarschuwt als `peildatum` te oud is.

[algemeen]
peildatum = 2026-10-10
energiebelasting_per_kwh = 0.11085   # 2026, eerste schijf, incl. btw
saldering = true                     # salderingsregeling vervalt per 1-1-2027 -> dan false
drempel_besparing_per_jaar = 50.0    # melding als een alternatief minstens zoveel per jaar scheelt
max_leeftijd_tarieven_dagen = 60
batterij_kwh = 15.0                  # 3x Sessy 5 kWh; gebruikt voor het scenario na einde saldering

# Jouw contract. Vóór `vanaf` geldt `vorige`. Beide moeten onder [[dynamisch]] staan.
# `prijsbasis`: de leverancier waarvan de historische kosten komen (Tibber-API/archief).
[huidig]
naam = "Zonneplan"
vanaf = 2026-11-01
vorige = "Tibber"
prijsbasis = "Tibber"

# --------------------------------------------------------------------------
# Dynamische contracten: stroomprijs = EPEX-uurprijs + inkoopvergoeding.
# terugleverkosten_per_kwh: wat je per teruggeleverde kWh t.o.v. de kale marktprijs
# betaalt (positief) of extra krijgt (negatief).
# De kale uurprijs is bij iedereen gelijk; alleen opslag en vaste kosten verschillen.
# --------------------------------------------------------------------------
[[dynamisch]]
naam = "Tibber"
inkoopvergoeding_per_kwh = 0.0248    # factuur sep 2026: 2,05 ct excl. btw
vaste_kosten_per_maand = 5.99        # factuur sep 2026: € 4,95 excl. btw (nieuwe klanten € 6,99)
terugleverkosten_per_kwh = 0.0       # inkoopvergoeding-credit en verkoopvergoeding (2,05 ct) heffen elkaar op
bron = "eigen Tibber-factuur september 2026"

[[dynamisch]]
naam = "Zonneplan"
inkoopvergoeding_per_kwh = 0.0200
vaste_kosten_per_maand = 6.25
terugleverkosten_per_kwh = -0.0200   # negatief = vergoeding: marktprijs + € 0,02
zonnebonus_pct = 0.10                # +10% overdag bij positieve prijs, max 7.500 kWh/jaar
bron = "stroomvoorspeller.nl, gecheckt 29-9-2026"

[[dynamisch]]
naam = "Frank Energie"
inkoopvergoeding_per_kwh = 0.0182
vaste_kosten_per_maand = 7.00
terugleverkosten_per_kwh = 0.0       # aanname: kale marktprijs, controleren
bron = "stroomvoorspeller.nl, gecheckt 29-9-2026"

[[dynamisch]]
naam = "ANWB Energie"
inkoopvergoeding_per_kwh = 0.0180
vaste_kosten_per_maand = 8.50
terugleverkosten_per_kwh = 0.0       # aanname: kale marktprijs, controleren
bron = "stroomvoorspeller.nl, gecheckt 29-9-2026"

# --------------------------------------------------------------------------
# Vaste / variabele contracten: all-in kWh-prijs incl. energiebelasting en btw.
# Gebruik tarief_dal = tarief_normaal voor een enkeltarief.
# Dal = 23:00-07:00 op werkdagen + hele weekend.
# --------------------------------------------------------------------------
[[vast]]
naam = "Budget Thuis 1 jaar vast"
tarief_normaal = 0.304
tarief_dal = 0.304
vaste_kosten_per_maand = 7.50
terugleverkosten_per_kwh = 0.0
terugleververgoeding_per_kwh = 0.0   # alleen relevant zonder saldering
welkomstbonus = 0.0
bron = "keuze.nl / overstappen.nl, oktober 2026 — vaste kosten controleren"

[[vast]]
naam = "Eneco 1 jaar vast"
tarief_normaal = 0.31347
tarief_dal = 0.31347
vaste_kosten_per_maand = 7.95
terugleverkosten_per_kwh = 0.0
terugleververgoeding_per_kwh = 0.0
welkomstbonus = 0.0
bron = "keuze.nl, oktober 2026 — vaste kosten controleren"

[[vast]]
