name: Maandelijkse energievergelijking

on:
  schedule:
    - cron: "17 7 3 * *"   # elke 3e van de maand, 07:17 UTC (maanddata is dan compleet)
  workflow_dispatch:
  push:                    # ook draaien na wijziging van code of tarieven
    paths:
      - "config/**"
      - "data/handmatig.csv"
      - "energievergelijker/**"
      - ".github/workflows/maandelijks.yml"

permissions:
  contents: write
  issues: write

jobs:
  vergelijk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: PYTHONPATH=.:tests python -m unittest discover -s tests

      - name: Rapport maken
        id: rapport
        env:
          TIBBER_TOKEN: ${{ secrets.TIBBER_TOKEN }}
          SOLAREDGE_API_KEY: ${{ secrets.SOLAREDGE_API_KEY }}
          SOLAREDGE_SITE_ID: ${{ secrets.SOLAREDGE_SITE_ID }}
        run: python -m energievergelijker

      - name: Rapport opslaan in repository
        run: |
          git config user.name "energievergelijker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rapporten/ data/
          git diff --cached --quiet || git commit -m "Energierapport ${{ steps.rapport.outputs.titel }}"
          git push

      - name: Melding bij beter alternatief
        if: steps.rapport.outputs.melding == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITEL: "💡 ${{ steps.rapport.outputs.titel }}"
        run: |
          gh issue list --state open --limit 100 --json title -q '.[].title' | grep -Fxq "$TITEL" && exit 0
          gh issue create \
            --title "$TITEL" \
            --body-file "${{ steps.rapport.outputs.rapport }}" \
            --assignee "${{ github.repository_owner }}"

      - name: Herinnering verbruik invoeren
        if: steps.rapport.outputs.ontbrekend != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TITEL: "📝 Verbruik invoeren: ${{ steps.rapport.outputs.ontbrekend }}"
        run: |
          gh issue list --state open --limit 100 --json title -q '.[].title' | grep -Fxq "$TITEL" && exit 0
          gh issue create \
            --title "$TITEL" \
            --assignee "${{ github.repository_owner }}" \
            --body "Voeg per maand één regel toe aan [data/handmatig.csv](${{ github.server_url }}/${{ github.repository }}/edit/${{ github.ref_name }}/data/handmatig.csv) met de cijfers uit de Zonneplan-app (Stroom → maandoverzicht):

          \`\`\`
          maand,afname_kwh,teruglevering_kwh
          2026-11,650,120
          \`\`\`

          Opslaan (commit) start de vergelijking automatisch. Sluit dit issue daarna."

      - name: Melding verouderde tarieven
        if: steps.rapport.outputs.verouderd == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITEL: "⚠️ Leverancierstarieven bijwerken"
        run: |
          gh issue list --state open --limit 100 --json title -q '.[].title' | grep -Fxq "$TITEL" && exit 0
          gh issue create \
            --title "$TITEL" \
            --body "De tarieven in config/leveranciers.toml zijn ouder dan de ingestelde limiet. Werk ze bij voor een betrouwbare vergelijking." \
            --assignee "${{ github.repository_owner }}"
